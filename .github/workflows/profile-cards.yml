name: Generate profile cards

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: "username=myendmess&show_icons=true&theme=tokyonight&hide_border=true&bg_color=1a1b27"
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: "username=myendmess&layout=compact&theme=tokyonight&hide_border=true&bg_color=1a1b27"
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: "true"

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: "user=myendmess&theme=tokyonight&hide_border=true&background=1a1b27"
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
